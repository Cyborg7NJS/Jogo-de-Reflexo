<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Jogo de Reflexo</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #ccc;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #placar {
      margin: 20px;
      font-size: 20px;
    }

    button {
      margin: 10px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Jogo de Reflexo</h1>
  <p>Clique primeiro quando a tela ficar VERDE!</p>

  <div id="placar">
    Jogador 1: <span id="p1">0</span> |
    Jogador 2: <span id="p2">0</span>
  </div>

  <button onclick="iniciar()">Iniciar Jogo</button><br>
  <button onclick="clicar(1)">Jogador 1</button>
  <button onclick="clicar(2)">Jogador 2</button>

  <script>
    let pronto = false
    let timeout
    let placar1 = 0
    let placar2 = 0

    function iniciar() {
      document.body.style.background = "#ccc"
      pronto = false
      clearTimeout(timeout)
      // tempo aleatório entre 2 e 5 segundos
      let tempo = Math.floor(Math.random() * 3000) + 2000
      timeout = setTimeout(() => {
        document.body.style.background = "green"
        pronto = true
      }, tempo)
    }

    function clicar(jogador) {
      if (!pronto) {
        alert("Calma! Espere ficar verde!")
        return
      }

      // evita que dois cliques sejam contados na mesma rodada
      pronto = false

      if (jogador === 1) {
        placar1++
        alert("Jogador 1 venceu!")
      } else {
        placar2++
        alert("Jogador 2 venceu!")
      }
      atualizarPlacar()
      iniciar()
    }

    // Atalho por teclado: tecla '1' para Jogador 1, '2' para Jogador 2
    document.addEventListener('keydown', function (e) {
      // evita digitar em caixas de texto (se futuros inputs existirem)
      const tag = (e.target && e.target.tagName) || ''
      if (tag === 'INPUT' || tag === 'TEXTAREA') return

      if (e.key === '1') {
        e.preventDefault()
        clicar(1)
      } else if (e.key === '2') {
        e.preventDefault()
        clicar(2)
      }
    })

    function atualizarPlacar() {
      document.querySelector("#p1").textContent = placar1
      document.querySelector("#p2").textContent = placar2
    }
  </script>
</body>
</html>
